<script>
    window.__consoleErrors = [];
    window.addEventListener('error', function (e) { window.__consoleErrors.push('error: ' + e.message); });
    (function () {
        var orig = console.error;
        console.error = function () {
            try {
                window.__consoleErrors.push(Array.prototype.map.call(arguments, function (x) {
                    return String((x && x.stack) || x);
                }).join(' ').slice(0, 600));
            } catch (_) { /* noop */ }
            orig.apply(console, arguments);
        };
    })();
</script>
